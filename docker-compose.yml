version: '3.8'

services:
  catalog:
    build: .
    container_name: catalog-service
    ports:
      - "${PORTA_ALUNO:-5000}:5000"
    environment:
      - TMDB_API_KEY=${TMDB_API_KEY}
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - SECRET_KEY=${SECRET_KEY}
      - AUTH_SERVICE_URL=http://auth-service:5000
      - APP_URL=${APP_URL:-http://localhost:${PORTA_ALUNO:-5000}}
      - LOG_SERVICE_URL=http://log-service:5000
    networks:
      - app-network
    depends_on:
      - auth-service

  auth-service:
    build: ./auth_service
    container_name: auth-service
    # Sem publicação de portas para o host (acessível apenas na rede interna do Docker)
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - SECRET_KEY=${SECRET_KEY}
      - MAIL_SERVER=${MAIL_SERVER:-sandbox.smtp.mailtrap.io}
      - MAIL_PORT=${MAIL_PORT:-2525}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_FROM=${MAIL_FROM:-no-reply@tomhanks.local}
      - APP_URL=${APP_URL:-http://localhost:${PORTA_ALUNO:-5000}}
      - LOG_SERVICE_URL=http://log-service:5000
    networks:
      - app-network

  log-service:
    build: ./log_service
    container_name: log-service
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - app-network
    depends_on:
      - redis

  redis:
    image: redis:alpine
    container_name: redis-service
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
