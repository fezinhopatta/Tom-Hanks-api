version: '3.8'

services:
  catalog:
    build: .
    container_name: catalog-service
    ports:
      - "${PORTA_ALUNO:-5000}:5000"
    environment:
      - TMDB_API_KEY=${TMDB_API_KEY}
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - SECRET_KEY=${SECRET_KEY}
      - AUTH_SERVICE_URL=http://auth-service:5000
      - APP_URL=${APP_URL:-http://localhost:${PORTA_ALUNO:-5000}}
      - LOG_SERVICE_URL=http://log-service:5000
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio}
      - MINIO_PORT=${MINIO_PORT:-9000}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - MINIO_BUCKET=${MINIO_BUCKET:-perfil-fotos}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:-http://localhost:9010}
    networks:
      - app-network
    depends_on:
      - auth-service
      - minio

  auth-service:
    build: ./auth_service
    container_name: auth-service
    ports:
      - "5001:5000"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - SECRET_KEY=${SECRET_KEY}
      - MAIL_SERVER=${MAIL_SERVER:-sandbox.smtp.mailtrap.io}
      - MAIL_PORT=${MAIL_PORT:-2525}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_FROM=${MAIL_FROM:-no-reply@tomhanks.local}
      - APP_URL=${APP_URL:-http://localhost:${PORTA_ALUNO:-5000}}
      - LOG_SERVICE_URL=http://log-service:5000
    networks:
      - app-network

  log-service:
    build: ./log_service
    container_name: log-service
    ports:
      - "5002:5000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - app-network
    depends_on:
      - redis

  redis:
    image: redis:alpine
    container_name: redis-service
    networks:
      - app-network

  # MinIO - Object Storage S3-compatível para arquivos de usuário (fotos de perfil)
  # Console web: http://localhost:9011 | API S3: http://localhost:9010
  minio:
    image: elestio/minio:latest
    container_name: tomhanks_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9010}:9000" # API S3 mapeada para porta 9010 externa (evita conflito com a porta 9000 do Portainer)
      - "${MINIO_CONSOLE_PORT:-9011}:9001" # Console web do MinIO na porta 9011 externa
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  minio_data:
    driver: local