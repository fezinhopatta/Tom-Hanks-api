<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir Senha | Tom Hanks</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
  <main class="auth-card">
    <span class="eyebrow">Tom Hanks / Segurança</span>
    <h1>Nova Senha</h1>
    <p class="lead">Digite sua nova senha de acesso abaixo.</p>
    {% with messages = get_flashed_messages() %}
      {% if messages %} <p class="flash">{{ messages[0] }}</p> {% endif %}
    {% endwith %}
    {% if error %}
      <p class="error-msg" style="color: #e63946; margin-bottom: 1rem;">{{ error }}</p>
      <div class="auth-link"><a href="{{ url_for('forgot_password') }}">Solicitar novo link de recuperação</a></div>
    {% else %}
      <form class="auth-form" method="POST">
        <div class="field">
          <label for="nova_senha">Nova Senha</label>
          <input id="nova_senha" type="password" name="nova_senha" required placeholder="Sua nova senha">
        </div>
        <button type="submit">Redefinir Senha</button>
      </form>
      <div class="auth-link"><a href="{{ url_for('login') }}">Voltar ao login</a></div>
    {% endif %}
  </main>
</body>
</html>
