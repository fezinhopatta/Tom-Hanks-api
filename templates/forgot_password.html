<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esqueci minha senha | Tom Hanks</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
  <main class="auth-card">
    <span class="eyebrow">Tom Hanks / Recuperação</span>
    <h1>Esqueceu sua senha?</h1>
    <p class="lead">Informe seu e-mail cadastrado para receber o link de redefinição.</p>
    {% with messages = get_flashed_messages() %}
      {% if messages %} <p class="flash">{{ messages[0] }}</p> {% endif %}
    {% endwith %}
    <form class="auth-form" method="POST">
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" type="email" name="email" required placeholder="seuemail@exemplo.com">
      </div>
      <button type="submit">Enviar Link de Recuperação</button>
    </form>
    <div class="auth-link"><a href="{{ url_for('login') }}">Voltar ao login</a></div>
  </main>
</body>
</html>
